<title>Stack Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free crypto average cost and DCA goal calculator. No sign-up.">
<meta name="theme-color" content="#0f6b55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar (currency switch), fixed bottom tab bar, sheets slide up for forms. */
:root {
  --bg: #f1f4f1; --surface: #ffffff; --surface-2: #e8ede9; --ink: #14201b; --muted: #5b6862; --line: #d6ddd8;
  --accent: #0f6b55; --accent-ink: #ffffff; --gold: #b77a12; --warn-bg: #fff4dc; --warn-ink: #7a4b00;
  --up: #12804a; --down: #c4352c; --up-bg: #e3f4ea; --down-bg: #fbe6e4;
  --f-display: "Sora", ui-sans-serif, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --r: 16px; --tap: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1311; --surface: #151d1a; --surface-2: #1d2824; --ink: #e6eee9; --muted: #95a49c; --line: #283530;
  --accent: #3cc39a; --accent-ink: #062018; --gold: #e2b24e; --warn-bg: #3a2c10; --warn-ink: #f5d48f;
  --up: #4fd88b; --down: #ff7b72; --up-bg: #12301f; --down-bg: #3a1916; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151d1a; --surface-2: #1d2824; --ink: #e6eee9; --muted: #95a49c; --line: #283530;
  --accent: #3cc39a; --accent-ink: #062018; --gold: #e2b24e; --warn-bg: #3a2c10; --warn-ink: #f5d48f;
  --up: #4fd88b; --down: #ff7b72; --up-bg: #12301f; --down-bg: #3a1916; color-scheme: dark; }
/* Korean convention: red = up, blue = down */
body.redup { --up: #d2342b; --up-bg: #fbe6e4; --down: #1d5fd1; --down-bg: #e3ecfb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.redup { --up: #ff7b72; --up-bg: #3a1916; --down: #79a8ff; --down-bg: #142443; } }
:root[data-theme="dark"] body.redup { --up: #ff7b72; --up-bg: #3a1916; --down: #79a8ff; --down-bg: #142443; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 18px/1 var(--f-display); letter-spacing: -.01em; margin-right: auto; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; min-width: 48px; height: 40px; border-radius: 999px; font: 700 17px/1 var(--f-display); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); }
.rate { display: block; font-size: 13px; color: var(--muted); padding-block: 0 8px; border: 0; background: none; width: 100%; text-align: left; }
.rate b { color: var(--ink); font-weight: 600; }
.rate svg { vertical-align: -4px; margin-right: 6px; }
.rate.bad { color: var(--warn-ink); background: var(--warn-bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.rate.bad b { color: var(--warn-ink); }

main { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 14px; padding-block: 4px 16px; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { border: 0; background: none; height: 64px; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"] svg { transform: translateY(-1px); }

/* cards and numbers */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); }
.hero { background: var(--surface); border-radius: 20px; padding: 18px 16px; border: 1px solid var(--line); display: grid; gap: 14px; }
.big { font: 700 clamp(30px, 9vw, 40px)/1.05 var(--f-display); letter-spacing: -.02em; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > div { min-width: 0; }
.mid { font: 600 20px/1.2 var(--f-display); overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 12px; font-weight: 700; font-size: 15px; min-width: 0; }
.chip span { font-weight: 600; font-size: 12px; opacity: .85; }
.up { color: var(--up); } .down { color: var(--down); }
.chip.up { background: var(--up-bg); } .chip.down { background: var(--down-bg); }
.pl { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pl .pct { font: 600 18px/1 var(--f-display); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chips .chip { display: grid; gap: 2px; justify-items: start; }

.notice { display: flex; gap: 10px; align-items: center; background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; border: 0; text-align: left; width: 100%; }
.notice b { font-weight: 700; }
.notice .go { margin-left: auto; font-weight: 700; white-space: nowrap; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 12px; color: var(--muted); }

/* coin list */
.coin { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.coin > button { width: 100%; border: 0; background: none; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; text-align: left; min-height: 72px; }
.badge { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--f-display); color: #fff; letter-spacing: -.02em; }
.coin .name { font: 700 17px/1.2 var(--f-display); }
.coin .right { text-align: right; min-width: 0; }
.coin .right .v { font: 600 17px/1.2 var(--f-display); }
.coin .detail { border-top: 1px dashed var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.kv > div { min-width: 0; }
.kv .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.kv .v { font-weight: 600; overflow-wrap: anywhere; }
.src { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); vertical-align: 2px; }
.src.live { color: var(--accent); }
.lot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.lot > div { min-width: 0; }
.lot .w { font-weight: 600; overflow-wrap: anywhere; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 2px; min-height: 40px; }
.formula { font-size: 13px; color: var(--muted); background: var(--surface-2); padding: 8px 10px; border-radius: 10px; overflow-wrap: anywhere; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 6; height: 60px; padding: 0 22px 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 8px; font: 700 16px/1 var(--f-display); box-shadow: 0 8px 22px rgb(15 107 85 / .35); }
@media (min-width: 600px) { .fab { right: calc(50% - 264px); } }

.btn { min-height: var(--tap); border-radius: 14px; border: 0; padding: 0 18px; font: 700 16px/1 var(--f-display); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--down-bg); color: var(--down); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }

.empty { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 28px 16px; }
.empty svg { color: var(--accent); }

/* forms / sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 22px 22px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { font: 700 20px/1.2 var(--f-display); margin: 0; flex: 1; }
.sheet-head { display: flex; align-items: center; gap: 10px; position: sticky; top: -8px; background: var(--bg); padding-block: 10px 4px; z-index: 1; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.input { width: 100%; min-height: var(--tap); border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 18px; }
.input:focus { border-color: var(--accent); outline: none; }
.input.err { border-color: var(--down); }
.inrow { display: flex; gap: 8px; }
.inrow .input { flex: 1; min-width: 0; }
.seg.sm button { min-width: 44px; height: 46px; font-size: 16px; }
.seg.txt button { font: 600 14px/1 var(--f-body); padding: 0 14px; }
.err-msg { color: var(--down); font-size: 14px; font-weight: 600; }
.calc { font-size: 14px; color: var(--muted); }
.calc b { color: var(--ink); }

/* road */
.road { display: grid; gap: 14px; }
.road-top { display: flex; align-items: center; gap: 14px; }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; font: 700 20px/1 var(--f-display); }
.ring-track { stroke: var(--surface-2); } .ring-fill { stroke: var(--accent); transition: stroke-dashoffset .4s; }
.checkin { min-height: 64px; font-size: 18px; }
.checkin.done { background: var(--up-bg); color: var(--up); }
.streak { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.pill.up { background: var(--up-bg); } .pill.down { background: var(--down-bg); }

/* photo */
.drop { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 28px 16px; border: 2px dashed var(--line); border-radius: 20px; background: var(--surface); cursor: pointer; }
.drop svg { color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.safe { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.safe svg { color: var(--accent); margin-top: 1px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.srow { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.srow.missing { border-color: var(--gold); }
.srow .inrow .input { font-size: 16px; min-height: 48px; }
.srow .sym { max-width: 110px; text-transform: uppercase; font-weight: 700; }
.srow .conv { font-size: 13px; color: var(--muted); }
.srow .miss { color: var(--gold); font-weight: 700; font-size: 13px; }
.xbtn { width: 48px; min-height: 48px; border-radius: 12px; border: 0; background: var(--down-bg); color: var(--down); display: grid; place-items: center; }
details { font-size: 13px; color: var(--muted); }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); padding: 10px; border-radius: 10px; max-height: 220px; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 700; z-index: 30; }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding-block: 8px; display: grid; gap: 4px; }
textarea.input { padding: 10px 14px; min-height: 90px; font-size: 13px; }
.set-group { display: grid; gap: 10px; }
.set-group h3 { margin: 0; font: 700 15px/1.2 var(--f-display); }
.price-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; }
.price-row .input { min-height: 46px; font-size: 16px; }
</style>

  <div class="wrap">
    <div class="brand"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 18h16M6 13h12M8 8h8"/></svg></i>Stack Math</div>
    <div class="seg" role="group" aria-label="Display currency" id="curSeg">

<main><div class="wrap"><div class="view" id="view"></div></div></main>

<nav class="tabs" aria-label="Tools">
  <div class="wrap">
    <button type="button" data-tab="avg" aria-current="page">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/><path d="M14 21l-1-4M19 21l-2-7"/></svg>
      <span data-t="road">DCA Road</span></button>

      <span data-t="photo">Photo</span></button>
  </div>
</nav>
