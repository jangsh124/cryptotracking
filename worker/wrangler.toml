name = "stackmath-scan"
main = "index.js"
compatibility_date = "2024-09-23"

[ai]
binding = "AI"

# KV namespace for rate limiting (optional but recommended).
# Create with: wrangler kv namespace create "RATE_LIMIT"
# Then replace YOUR_KV_NAMESPACE_ID below with the id from that command.
# If you skip this, rate limiting is disabled (still safe for low-traffic use).
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "YOUR_KV_NAMESPACE_ID"
